# Blueprint de Render: la app web de la EA3 como servicio Docker.
# Render solo despliega un commit de main cuando sus checks de GitHub Actions
# (CI: pruebas + imagen Docker) terminaron en verde (autoDeployTrigger: checksPass).
# El workflow deploy-render.yml verifica después que producción sirva ese commit.
services:
  - type: web
    name: ea3-galaxy-a55
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /salud
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: produccion
