[project]
name = "ea3-devops-scraping-galaxy-a55"
version = "3.0.0"
description = "Scraper, app web y CI/CD del Samsung Galaxy A55 en Mercado Libre Colombia (EA3)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*httpx.*starlette.testclient.*"]

[tool.coverage.run]
source = ["scraping", "app"]
omit = ["scraping/01_selenium_navegador.py"]   # requiere un navegador real con sesión gráfica

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "figuras"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E402"]   # settings.py y las pruebas ajustan sys.path antes de importar

[tool.ruff.lint.isort]
known-first-party = ["config", "parsers", "ml_scrapy", "conftest", "app"]
