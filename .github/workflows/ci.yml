# Integración continua: cada cambio que llega a main o a un pull request se
# valida con lint, pruebas automatizadas, una ejecución completa del pipeline
# de datos sobre el HTML capturado por Selenium (sin peticiones a Mercado Libre)
# y la construcción y prueba de la imagen Docker de la app web.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      EA2_SALIDA: ${{ github.workspace }}/salida
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Revisar estilo (ruff)
        run: ruff check . --output-format=github

      - name: Ejecutar pruebas (pytest)
        run: pytest --cov --cov-report=term --cov-report=xml --junitxml=reporte-pruebas.xml

      - name: Ejecutar el pipeline de datos fuera de línea
        working-directory: scraping
        run: |
          python 02_bs4_listado.py --local
          cd ml_scrapy
          scrapy crawl galaxy_a55 -a origen=local -s LOG_LEVEL=WARNING \
            -s DOWNLOAD_DELAY=0 -s AUTOTHROTTLE_ENABLED=False
          cd ..
          python 04_analisis.py

      - name: Publicar el resumen en la ejecución
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          r = json.load(open(os.path.join(os.environ["EA2_SALIDA"], "data", "resumen.json"), encoding="utf-8"))
          cop = lambda x: f"${x:,.0f}".replace(",", ".")
          print("### Resultado del análisis (Python ${{ matrix.python }})\n")
          print("| Indicador | Valor |\n|---|---|")
          print(f"| Publicaciones extraídas | {r['publicaciones_totales']} |")
          print(f"| Publicaciones del Galaxy A55 | {r['publicaciones_a55']} |")
          print(f"| Precio mediano | {cop(r['precio']['50%'])} |")
          for c in r["por_condicion"]:
              print(f"| Mediana {c['condicion'].lower()} (n={c['count']}) | {cop(c['median'])} |")
          print(f"| Envío gratis | {r['pct_envio_gratis']:.0f} % |")
          EOF

      - name: Guardar resultados como artefacto
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: resultados-analisis
          path: |
            salida/
            coverage.xml
            reporte-pruebas.xml
          retention-days: 14

  # La misma imagen que se despliega en Render se construye y se prueba aquí
  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGEN: ea3-galaxy-a55:${{ github.sha }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Construir la imagen
        run: docker build -t "$IMAGEN" .

      - name: Levantar el contenedor
        run: docker run -d --name app -p 8000:8000 -e RENDER_GIT_COMMIT=${{ github.sha }} "$IMAGEN"

      - name: Smoke test de la app
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/salud && break; sleep 1; done
          echo
          curl -fsS http://127.0.0.1:8000/salud | grep -q '"commit":"${{ github.sha }}"'
          curl -fsS http://127.0.0.1:8000/api/resumen | grep -q '"publicaciones_a55":30'
          curl -fsS "http://127.0.0.1:8000/api/publicaciones?condicion=Nuevo&limite=1" | grep -q '"condicion":"Nuevo"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/publicaciones/MCO000)" = 404
          curl -fsS http://127.0.0.1:8000/ | grep -q "Publicaciones del Galaxy A55"
          curl -fsS -o /dev/null http://127.0.0.1:8000/figuras/fig1_histograma_precios.png

      - name: Esperar el HEALTHCHECK de Docker
        run: |
          for i in $(seq 1 20); do
            estado=$(docker inspect --format '{{.State.Health.Status}}' app)
            echo "health: $estado"
            [ "$estado" = healthy ] && exit 0
            sleep 3
          done
          exit 1

      - name: Publicar el tamaño de la imagen
        run: |
          echo "### Imagen Docker" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGEN\` · $(docker image inspect "$IMAGEN" --format '{{.Size}}' | numfmt --to=iec) · smoke test OK" >> "$GITHUB_STEP_SUMMARY"

      - name: Registros del contenedor
        if: always()
        run: docker logs app

  # Check único que exige la protección de la rama main
  ci:
    name: ci
    needs: [pruebas, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que las pruebas y la imagen pasaron
        run: |
          test "${{ needs.pruebas.result }}" = "success"
          test "${{ needs.docker.result }}" = "success"
